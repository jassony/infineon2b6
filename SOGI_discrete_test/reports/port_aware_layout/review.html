<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOGI 布局前后对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f6;color:#20252a;font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif}
header{padding:18px 24px;background:white;border-bottom:1px solid #d9dee3}h1{font-size:22px;margin:0 0 7px}p{margin:5px 0;color:#52606a}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}select,button{font:inherit;padding:7px 10px;background:white;border:1px solid #bac5ce;border-radius:5px}a{color:#126599}
main{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px;max-width:100vw}section{min-width:0;border:1px solid #d1d8df;border-radius:7px;background:white;overflow:hidden}h2{margin:0;padding:10px 14px;font-size:16px;border-bottom:1px solid #d9dee3}.viewport{height:calc(100vh - 250px);min-height:400px;overflow:auto;background:white;padding:5px}img{display:block;max-width:none;height:auto}
footer{padding:0 24px 16px;color:#59636c;font-size:13px}@media(max-width:750px){main{grid-template-columns:1fr}.viewport{height:500px}}
</style>
<header>
<h1>SOGI 布局前后对照</h1>
<p>按端口、完整文字和模块类型定尺；保留算法、接口及连接关系。前后图已统一文字显示比例，可分别滚动查看。</p>
<div class="bar">
<label>图层 <select id="scope">
<option>比较模型总图</option><option>FE 内部</option><option>BE 内部</option><option>Tustin 内部</option><option>ZOH 内部</option><option>验证模型总图</option><option>连续参考内部</option>
</select></label>
<label>缩放 <select id="zoom"><option value="1">100%</option><option value="0.75">75%</option><option value="0.5">50%</option><option value="0.25">25%</option></select></label>
<button id="origin">回到左上角</button>
<a href="layout_review.md">实施记录</a><a id="full" href="after_1.png">打开调整后原图</a>
</div>
</header>
<main><section><h2>调整前</h2><div class="viewport"><img id="before" alt="调整前模型图"></div></section><section><h2>调整后</h2><div class="viewport"><img id="after" alt="调整后模型图"></div></section></main>
<footer>共 7 个图层、275 个模块、233 条连线。5012 项自动检查通过；16 项线标签坐标未自动量测，已单独完成人工图面复核。本轮未编译或运行数值仿真。</footer>
<script>
const beforeWidths=[6535,4784,3756,3756,3756,5519,3075];
const afterWidths=[1734,3444,2294,2294,2294,3200,1804];
const scope=document.getElementById('scope'),zoom=document.getElementById('zoom');
function show(){const i=scope.selectedIndex,n=i+1,z=Number(zoom.value);const a=document.getElementById('before'),b=document.getElementById('after');a.src=`before_view_${n}.png`;b.src=`after_${n}.png`;a.style.width=beforeWidths[i]*0.72*z+'px';b.style.width=afterWidths[i]*z+'px';document.getElementById('full').href=b.src;}
scope.addEventListener('change',()=>{show();document.querySelectorAll('.viewport').forEach(p=>p.scrollTo(0,0));});zoom.addEventListener('change',show);document.getElementById('origin').addEventListener('click',()=>document.querySelectorAll('.viewport').forEach(p=>p.scrollTo(0,0)));show();
</script>
</html>
